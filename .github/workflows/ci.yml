name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      FLICKERVOID_ENGINE: ${{ github.workspace }}/FlickerVoidNGN
    steps:
      # The game and the engine side by side; FLICKERVOID_ENGINE names the engine, as on a developer's machine.
      - uses: actions/checkout@v6
        with:
          path: Bleeders
      # The engine's branch of the same name while a game change waits on an engine pull request, else its main.
      - name: Find the engine's branch
        id: engine
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=main
          if git ls-remote --exit-code --heads https://github.com/tec-sx/FlickerVoidNGN.git "$BRANCH" > /dev/null; then ref="$BRANCH"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: tec-sx/FlickerVoidNGN
          ref: ${{ steps.engine.outputs.ref }}
          path: FlickerVoidNGN
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: Bleeders/global.json
      - name: Build
        working-directory: Bleeders
        run: dotnet build Bleeders.slnx -c Release
      - name: Test
        working-directory: Bleeders
        run: dotnet test --solution Bleeders.slnx -c Release --no-build
